services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Ejecuta npm run setup primero}
    ports:
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    volumes:
      - virelia_mysql:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent",
        ]
      interval: 3s
      timeout: 3s
      retries: 30
volumes:
  virelia_mysql:
